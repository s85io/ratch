name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Programs for the real-program tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y vim htop less
      - run: sh scripts/ci-test.sh
      - name: Black-box suite
        run: |
          cargo build --release
          sh tests/test.sh "$PWD/target/release/ratch"

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sh scripts/ci-test.sh --target x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Static, and not too big
        run: |
          bin=target/x86_64-unknown-linux-musl/release/ratch
          file "$bin" | grep -q 'statically linked\|static-pie'
          size=$(stat -c %s "$bin")
          echo "static binary: $size bytes"
          test "$size" -le 1048576
          sh tests/test.sh "$PWD/$bin"

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust
          envs: GITHUB_ACTIONS
          run: |
            sh scripts/ci-test.sh
            cargo build --release
            sh tests/test.sh "$PWD/target/release/ratch"
