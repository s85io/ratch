[package]
name = "ratch"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Detachable terminal sessions without terminal emulation"
license = "GPL-2.0-or-later"
repository = "https://github.com/s85io/ratch"

[lib]
name = "ratch"
path = "src/lib.rs"

[[bin]]
name = "ratch"
path = "src/main.rs"

[dependencies]
rustix = { version = "1.1", default-features = false, features = [
    "std", "event", "fs", "net", "process", "pty", "stdio", "termios",
] }
signal-hook = { version = "0.4", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
